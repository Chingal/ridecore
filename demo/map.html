<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ridecore live map</title>
  <!-- Demo only (ADR 0005): not a product frontend. Open it from disk after `make demo-map`. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
          integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root { --bg: #f6f7f9; --panel: #ffffff; --text: #1d232b; --muted: #5f6b7a; --line: #dde2e8; --accent: #1f6feb; --ok: #1a7f37; --warn: #b54708; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1318; --panel: #171c23; --text: #e6e9ee; --muted: #9aa5b3; --line: #2a313b; --accent: #4c8dff; --ok: #3fb950; --warn: #f0883e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 15px; margin: 0 12px 0 0; }
    input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 0; }
    #url { flex: 2 1 280px; } #token { flex: 1 1 200px; }
    button { font: inherit; padding: 6px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
    #status { color: var(--muted); }
    main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
    #map { min-height: 300px; }
    aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 12px 16px; }
    aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 6px; }
    .trip { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
    .trip b { font-variant-numeric: tabular-nums; }
    .state { color: var(--ok); font-weight: 600; }
    #log { font: 12px/1.5 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  </style>
</head>
<body>
  <header>
    <h1>ridecore · live map</h1>
    <input id="url" placeholder="WebSocket URL (make demo-map prints it)" aria-label="WebSocket URL">
    <input id="token" type="password" placeholder="Passenger token" aria-label="Passenger token" autocomplete="off">
    <button id="connect">Connect</button>
    <span id="status">disconnected</span>
  </header>
  <main>
    <div id="map"></div>
    <aside>
      <h2>Cars in view</h2>
      <div id="cars">none yet</div>
      <h2>My trips</h2>
      <div id="trips">none yet</div>
      <h2>Messages</h2>
      <div id="log"></div>
    </aside>
  </main>
  <script>
    // The token lives only in this page's memory: it is never stored, logged or put in the URL.
    const CENTRE = [2.4419, -76.6063];
    const CAR_TTL_MS = 30_000;
    const PING_MS = 5 * 60_000;

    const map = L.map('map').setView(CENTRE, 15);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    const cars = new Map();       // driverId -> { marker, seen }
    const trips = new Map();      // tripId -> highest pushed event (by version)
    let driverMarker = null;      // the assigned driver of my trip
    let socket = null;
    let pinger = null;

    const $ = (id) => document.getElementById(id);
    const log = (text) => { $('log').textContent = `${new Date().toLocaleTimeString()} ${text}\n` + $('log').textContent.slice(0, 4000); };
    const carIcon = L.divIcon({ className: '', html: '<div style="font-size:22px">🚗</div>', iconSize: [24, 24], iconAnchor: [12, 12] });
    const myIcon = L.divIcon({ className: '', html: '<div style="font-size:26px">🚕</div>', iconSize: [28, 28], iconAnchor: [14, 14] });

    function renderCars() {
      $('cars').textContent = cars.size === 0 ? 'none in view' : `${cars.size} available nearby`;
    }
    function renderTrips() {
      if (trips.size === 0) { $('trips').textContent = 'none yet'; return; }
      $('trips').replaceChildren(...[...trips.values()].map((e) => {
        const div = document.createElement('div');
        div.className = 'trip';
        div.innerHTML = `<b></b><br><span class="state"></span> · v<span></span>`;
        div.querySelector('b').textContent = e.tripId.slice(0, 8);
        div.querySelector('.state').textContent = e.payload.toState ?? e.type;
        div.querySelector('span:last-child').textContent = e.version;
        return div;
      }));
    }

    function onMessage(m) {
      if (m.type === 'car') {
        const pos = [m.position.lat, m.position.lng];
        const car = cars.get(m.driverId);
        if (car) { car.marker.setLatLng(pos); car.seen = Date.now(); }
        else cars.set(m.driverId, { marker: L.marker(pos, { icon: carIcon, title: m.category }).addTo(map), seen: Date.now() });
        renderCars();
      } else if (m.type === 'car.left') {
        cars.get(m.driverId)?.marker.remove();
        cars.delete(m.driverId);
        renderCars();
      } else if (m.type === 'trip') {
        // Pushes are at-least-once and unordered: keep only the newest version of each trip.
        const known = trips.get(m.event.tripId);
        if (!known || m.event.version > known.version) { trips.set(m.event.tripId, m.event); renderTrips(); }
        log(`${m.event.type} v${m.event.version}`);
      } else if (m.type === 'driver_position') {
        const pos = [m.position.lat, m.position.lng];
        if (driverMarker) driverMarker.setLatLng(pos);
        else driverMarker = L.marker(pos, { icon: myIcon, title: 'your driver' }).addTo(map);
      } else if (m.type === 'error') {
        log(`error ${m.code}: ${m.message}`);
      }
    }

    // A car that stops reporting (it moved to another cell, or the socket dropped) leaves the map.
    setInterval(() => {
      const now = Date.now();
      for (const [id, car] of cars) if (now - car.seen > CAR_TTL_MS) { car.marker.remove(); cars.delete(id); }
      renderCars();
    }, 5000);

    function watchCentre() {
      const c = map.getCenter();
      socket?.send(JSON.stringify({ action: 'watch', lat: c.lat, lng: c.lng }));
    }
    map.on('moveend', () => socket?.readyState === WebSocket.OPEN && watchCentre());

    $('connect').onclick = () => {
      socket?.close();
      clearInterval(pinger);
      const url = $('url').value.trim();
      const token = $('token').value.trim();
      if (!url || !token) { $('status').textContent = 'URL and token are required'; return; }
      $('status').textContent = 'connecting…';
      socket = new WebSocket(url, ['ridecore.v1', token]);
      socket.onopen = () => {
        $('status').textContent = 'connected';
        watchCentre();
        pinger = setInterval(() => socket.send(JSON.stringify({ action: 'ping' })), PING_MS);
      };
      socket.onmessage = (e) => onMessage(JSON.parse(e.data));
      socket.onclose = () => { $('status').textContent = 'disconnected'; clearInterval(pinger); };
      socket.onerror = () => { $('status').textContent = 'connection refused (token or URL?)'; };
    };
  </script>
</body>
</html>
